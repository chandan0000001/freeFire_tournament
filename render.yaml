services:
  - type: web
    name: rit-esports-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: ADMIN_WHATSAPP_NUMBER
        sync: false
      - key: WHATSAPP_COMMUNITY_URL
        sync: false
      - key: ADMIN_UPI_ID
        sync: false
      - key: ADMIN_UPI_NAME
        sync: false
      - key: ADMIN_UPI_AID
        sync: false
      - key: ADMIN_UPI_URI
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: SITE_NAME
        sync: false
      - key: SITE_REGION
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: REDIS_KEY_PREFIX
        value: "rahul-arena:"
      - key: TRUST_PROXY_HOPS
        value: "1"
