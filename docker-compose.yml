version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rit-esports-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./server/uploads:/usr/src/app/uploads

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rit-esports-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
